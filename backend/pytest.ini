[pytest]
minversion = 7.0

# Current SENTINEL-X regression suite.
# The older tests are preserved under backend/tests but target
# modules that no longer exist in the current architecture.
testpaths = tests/current

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra -q

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function