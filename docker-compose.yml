version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinelx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./database:/app/database
      - ml_artifacts:/app/ml_artifacts
    networks:
      - sentinelx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - sentinelx-net

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: sentinelx-simulator
    restart: "no"
    env_file:
      - .env
    depends_on:
      - backend
    profiles:
      - simulation
    networks:
      - sentinelx-net

volumes:
  pgdata:
    name: sentinelx-pgdata

  ml_artifacts:
    name: sentinelx-ml-artifacts

networks:
  sentinelx-net:
    name: sentinelx-net
    driver: bridge